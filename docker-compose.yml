services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-workspace-backend
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DOCUMENTS_DIR: /app/data/documents
    ports:
      - "8000:8000"
    volumes:
      - ./data/documents:/app/data/documents
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: rag-workspace-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: rag-workspace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-workspace-qdrant
    profiles: ["local-infra"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  mongo:
    image: mongo:7
    container_name: rag-workspace-mongo
    profiles: ["local-infra"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  qdrant_data:
  mongo_data:
