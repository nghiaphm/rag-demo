services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag
    ports:
      # Host 5432 đang bị một PostgreSQL native chiếm; dùng 5433 để tránh đụng.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
