name: Backend CI

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".env.example"
      - "docker-compose.yml"
      - ".dockerignore"

  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Backend Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.env.example'
              - 'docker-compose.yml'
              - '.dockerignore'

  backend-ci:
    name: Backend CI (Architecture, Unit & Offline Tests)
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
       needs.changes.outputs.backend == 'true')

    env:
      PYTHONPATH: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check dependency integrity (pip check)
        run: |
          pip check

      - name: Compile Python bytecode
        run: |
          python -m compileall -q backend/app backend/tests backend/evaluation backend/scripts

      - name: Prepare environment configuration
        run: |
          cp .env.example .env

      - name: Run Architecture Rules Tests
        run: |
          python -m unittest discover -s backend/tests/architecture -v

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s backend/tests/unit -v

      - name: Run Integration Tests (Offline)
        run: |
          python -m unittest discover -s backend/tests/integration -v

      - name: Run Offline Smoke Tests
        run: |
          python backend/tests/smoke/smoke_sse_schema.py
          python backend/tests/smoke/smoke_context_budget.py
          python backend/tests/smoke/smoke_query_rewriting.py

      - name: Run Advanced Feature Flags & Evaluation Plumbing Check
        env:
          TOOL_USE_ENABLED: "true"
          AGENTIC_MODE_ENABLED: "true"
          CORRECTIVE_RAG_ENABLED: "true"
          EXCEL_PARQUET_INGESTION_ENABLED: "true"
          EXCEL_SQL_ENABLED: "true"
          HYBRID_SEARCH_ENABLED: "true"
          RERANKER_ENABLED: "true"
        run: |
          python -c "from app.shared.config import Settings; s = Settings(_env_file='.env'); assert s.tool_use_enabled and s.agentic_mode_enabled and s.corrective_rag_enabled and s.excel_parquet_ingestion_enabled and s.excel_sql_enabled"
          python -m unittest backend/tests/unit/test_agentic_orchestrator.py backend/tests/unit/test_corrective_rag.py backend/tests/unit/test_sql_guard.py backend/tests/unit/test_duckdb_executor.py backend/tests/integration/test_chat_sql_routing.py backend/tests/integration/test_run_sql_rbac.py backend/tests/integration/test_excel_parquet_ingestion.py -v
          python -m evaluation.runner.eval_agent_cli --mode offline_smoke
          python -m evaluation.runner.benchmark_matrix --offline-check

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile local-infra config --quiet

      - name: Build Hardened Backend Docker Image & Verify Non-Root
        run: |
          docker build -f backend/Dockerfile -t rag-workspace-backend:ci .
          docker run --rm --entrypoint sh rag-workspace-backend:ci -c 'test "$(id -u)" -ne 0'

      - name: Run Python Dependency Security Audit (Advisory Review)
        continue-on-error: true
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit -r backend/requirements.txt --desc | tee pip-audit-report.txt
          {
            echo "## Backend pip-audit Advisory Report"
            echo '```'
            cat pip-audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
