name: Frontend CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for offline contract parity tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies (for contract verification)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare environment configuration
        run: |
          cp .env.example .env

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run Runtime Dependency Security Audit
        working-directory: frontend
        run: |
          npm audit --omit=dev

      - name: Run ESLint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Run Unit & Offline Contract Tests
        working-directory: frontend
        env:
          PYTHON: python
        run: |
          npm test
          npm run test:contract

      - name: Run Next.js Standalone Production Build
        working-directory: frontend
        run: |
          npm run build

      - name: Install Playwright Chromium & Run E2E Suite
        working-directory: frontend
        env:
          PYTHON: python
        run: |
          npx playwright install --with-deps chromium
          npm run build:e2e
          npm run test:e2e

      - name: Build Hardened Frontend Docker Image & Verify Non-Root
        run: |
          docker build -f frontend/Dockerfile -t rag-workspace-frontend:ci .
          docker run --rm --entrypoint sh rag-workspace-frontend:ci -c 'test "$(id -u)" -ne 0'
