name: Frontend CI

on:
  push:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "backend/app/**"
      - ".env.example"
  pull_request:
    branches:
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "backend/app/**"
      - ".env.example"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI (Lint, Typecheck, Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (for offline contract parity tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies (for contract verification)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare environment configuration
        run: |
          cp .env.example .env

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run ESLint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: |
          npm run typecheck

      - name: Run Unit & Offline Contract Tests
        working-directory: frontend
        env:
          PYTHON: python
        run: |
          npm test
          npm run test:contract

      - name: Run Next.js Production Build
        working-directory: frontend
        run: |
          npm run build
